<script>
  // ===== 공통 유틸리티 (Login/Student/Teacher 페이지 공용) =====

  /** google.script.run을 Promise로 감싸서 async/await로 쓰기 편하게 함 */
  function runServer(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) {
          reject(err && err.message ? err : new Error(String(err)));
        });
      runner[fnName].apply(runner, args);
    });
  }

  /**
   * 같은 웹앱 배포 안에서 다른 화면(page)으로 이동.
   *
   * 주의: 이 코드는 구글 앱스 스크립트가 만든 "안쪽 프레임" 안에서 실행된다.
   * window.top(바깥 프레임)은 다른 origin이라서 window.top.location.href를
   * 읽으려고(read) 하면 브라우저 보안 정책 때문에 오류가 난다. 반면 window.top의
   * 주소를 쓰는(write/이동시키는) 것은 원래 허용된다. 그래서 현재 주소를 읽어서
   * 새 주소를 만드는 대신, 서버(doGet)가 미리 계산해서 심어준 APP_URL을 그대로
   * 사용해 이동한다. (이전에는 읽기 시도가 실패해 엉뚱한 곳으로 이동하는 버그가 있었다)
   */
  function goToPage(page) {
    var target = (typeof APP_URL !== 'undefined' && APP_URL ? APP_URL : window.location.href.split('?')[0]) +
      '?page=' + page;
    try {
      window.top.location.href = target;
    } catch (e) {
      window.location.href = target;
    }
  }

  function getSession() {
    try {
      var raw = sessionStorage.getItem('musun_user');
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function setSession(user) {
    try {
      sessionStorage.setItem('musun_user', JSON.stringify(user));
    } catch (e) {
      /* 세션 저장이 불가능한 환경이면 무시 */
    }
  }

  function clearSession() {
    try {
      sessionStorage.removeItem('musun_user');
    } catch (e) {}
  }

  function logout() {
    clearSession();
    goToPage('login');
  }

  function showSpinner(show) {
    var el = document.getElementById('spinner');
    if (el) el.classList.toggle('hidden', !show);
  }

  function showMsg(el, text, type) {
    if (!el) return;
    el.textContent = text;
    el.className = 'msg ' + (type || 'error');
  }

  function hideMsg(el) {
    if (!el) return;
    el.className = 'msg hidden';
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /**
   * 사진 파일을 태블릿/서버 부담이 적도록 줄여서(최대 1024px, JPEG 70%)
   * base64 문자열로 변환한다.
   * 반환값: { base64, mime }
   */
  function compressImageToBase64(file) {
    var MAX_SIZE = 1024;
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('사진을 읽는 중 오류가 발생했습니다.')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('사진을 불러오지 못했습니다.')); };
        img.onload = function () {
          var w = img.width, h = img.height;
          if (w > h && w > MAX_SIZE) { h = Math.round((h * MAX_SIZE) / w); w = MAX_SIZE; }
          else if (h > MAX_SIZE) { w = Math.round((w * MAX_SIZE) / h); h = MAX_SIZE; }

          var canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          var dataUrl = canvas.toDataURL('image/jpeg', 0.7);
          var base64 = dataUrl.split(',')[1];
          resolve({ base64: base64, mime: 'image/jpeg' });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
</script>
